[project]
name = "kbo-occultation"
version = "0.2.0"
description = "Simulation of KBO stellar occultation diffraction patterns"
authors = [{name="eliadse"}]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "astropy",
    "pandas",
    "pyyaml",
    # Comment-preserving edits of observation_log.yaml (kbo-night prepare). Pinned:
    # observations.log.set_value/append_key use ruamel's comment internals.
    "ruamel.yaml==0.19.1",
    "astroquery",    # SIMBAD lookups of star coordinates / magnitudes (kbo-night prepare)
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kbo-night = "kbo_occultation.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kbo_occultation*"]

[tool.setuptools.package-data]
"kbo_occultation.data" = ["**/*.txt", "**/*.dat", "**/*.fits", "**/*.csv", "**/*.yaml", "**/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
