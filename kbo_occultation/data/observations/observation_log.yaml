# Observation log for the fast-photometry test-star campaign.
#
# Single source of truth for everything the stat-binary files do NOT contain:
# star identity, magnitudes, coordinates, good-time windows, faulty mirrors,
# eLog notes and where the auxiliary (DC / CC) reports live. Loaded by
# kbo_occultation.observations.log; rendered as tables in
# notebooks/snr_study.ipynb and by `kbo-night`.
#
# Conventions
# - file / dc_report / conditions_dir are relative to this file's directory
#   (or to $KBO_OBSERVATIONS_DIR if set) unless absolute.
# - cc_reports point to the raw MAGIC CC .rep files (outside the repo, ~300 MB),
#   relative to paths.cc_reports_root (or $KBO_CC_REPORTS_ROOT if set);
#   `kbo-night prepare <night>` condenses them into conditions/<night>/*.csv.
# - good_time: [start, stop] in seconds relative to the first sample of the
#   run; null = use the whole run.
# - Coordinates (ICRS, deg), B/V magnitudes and spectral types: SIMBAD,
#   queried 2026-10-14.
# - Zd/airmass/moon are NOT typed here: they are computed from the coordinates
#   and the run's time span (cc_reports.pointing_conditions) and cross-checked
#   against the CC reports. Use `manual:` only to override a measured value.
# - faulty_mirrors: {telescope: number of mirror panels not correctly focused}
#   = undefined + error panels of the CC AMC-REPORT (PANELS fields 2 and 4),
#   median over the run, outside adjustments (cc_reports.amc_unfocused_panels).
#   An observation's own faulty_mirrors overrides the night value. LST-1's AMC
#   is not in the MAGIC CC reports (null).
# - null + "TODO(user)" marks information only you can supply (eLog, shift
#   reports, ...).

paths:
  # Root of the raw MAGIC CC .rep files; override with $KBO_CC_REPORTS_ROOT.
  cc_reports_root: ~/Projects/Fast_photometry/DCs

site:
  # Geodetic site coordinates come from config.ORM_ARRAY (not repeated here).
  name: ORM La Palma
  # Atmospheric extinction coefficients (mag / airmass) used by
  # snr_measurement.extinction_factor. k_B = 0.23 is the value used in the old
  # check_fast_photometry_data notebook; k_V = 0.13 is a typical ORM value.
  extinction_k:
    B: 0.23
    V: 0.13

